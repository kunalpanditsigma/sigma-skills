<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Plugin name</title>
<!-- React UMD must load before the SDK; the SDK UMD exposes window.SigmaPlugin.client -->
<script src="https://unpkg.com/react@18.3.1/umd/react.production.min.js"></script>
<script src="https://unpkg.com/@sigmacomputing/plugin@1.3.2/dist/umd/sigmacomputing-plugin.umd.js"></script>
<style>
  /* Scope EVERYTHING to #pl: a global rule (svg {position:absolute}) once covered the iframe and ate every click */
  html, body { margin: 0; height: 100%; background: #fff; overflow: hidden; }
  #pl { --ink: #1F2328; --muted: #8A8E96; --line: #E6E8EC; --accent: #4F7CC9; --tint: #F2F5FA;
        position: absolute; inset: 0; display: flex; flex-direction: column; color: var(--ink);
        font: 12px/1.35 "Helvetica Neue", Arial, sans-serif; }
  #pl * { box-sizing: border-box; }
  #pl .hdr { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 12px 16px 8px; flex-wrap: wrap; }
  #pl .ttl { font-size: 15px; font-weight: 700; }
  #pl .sub { color: var(--muted); font-size: 11px; }
  #pl .tabs { display: flex; gap: 4px; flex-wrap: wrap; }
  #pl .tab { border: 1px solid var(--line); background: #fff; color: var(--ink); border-radius: 999px; padding: 4px 11px; font: 600 11px inherit; cursor: pointer; }
  #pl .tab.on { background: var(--accent); border-color: var(--accent); color: #fff; }
  #pl .body { flex: 1; overflow-y: auto; padding: 4px 16px 14px; }
  #pl .row { display: grid; grid-template-columns: 140px 1fr 70px; align-items: center; gap: 10px; height: 26px; padding: 0 6px; border-radius: 6px; cursor: pointer; }
  #pl .row:hover { background: #F7F8FA; }
  #pl .row.sel { background: var(--tint); }
  #pl .lbl { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-weight: 600; }
  #pl .trk { height: 8px; background: #EEF0F3; border-radius: 4px; position: relative; }
  #pl .fill { position: absolute; inset: 0 auto 0 0; width: 0; background: var(--accent); border-radius: 4px; }
  #pl .val { text-align: right; font-variant-numeric: tabular-nums; font-weight: 700; }
  #pl .tip { position: absolute; pointer-events: none; background: #fff; border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px;
             box-shadow: 0 6px 18px rgba(17,17,17,.12); font-size: 11px; max-width: 240px; opacity: 0; transition: opacity .12s; z-index: 5; }
  #pl .empty { padding: 40px; color: var(--muted); text-align: center; }
</style>
</head>
<body>
<div id="pl">
  <div class="hdr">
    <div><div class="ttl" id="ttl">Plugin name</div><div class="sub" id="sub"></div></div>
    <div class="tabs" id="tabs"></div>
  </div>
  <div class="body" id="body"><div class="empty">Loading…</div></div>
  <div class="tip" id="tip"></div>
</div>
<script>
(function () {
  "use strict";
  var client = (window.SigmaPlugin && window.SigmaPlugin.client) || null;

  // ---- 1. Bindings. Each key is an editor-panel column; LABELS double as the name-based fallback,
  //         so name the feed table's columns exactly like these labels.
  var KEYS = ["label", "group", "value", "detail"];
  var LABELS = { label: "Label", group: "Group", value: "Value", detail: "Detail" };
  var NUM = { value: 1 };
  if (client) client.config.configureEditorPanel([{ name: "source", type: "element" }].concat(KEYS.map(function (k) {
    return { name: k, type: "column", source: "source", label: LABELS[k] };
  })));

  var st = { rows: [], cfg: {}, cols: {}, dd: null, tab: "All", sel: null };
  var $ = function (id) { return document.getElementById(id); };
  function esc(s) { return String(s == null ? "" : s).replace(/[&<>"]/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]; }); }
  function fmt(v) { return v == null ? "–" : Math.abs(v) >= 1e6 ? (v / 1e6).toFixed(1) + "M" : Math.abs(v) >= 1e3 ? (v / 1e3).toFixed(1) + "K" : String(Math.round(v * 10) / 10); }

  // ---- 2. Render. Draw statically (headless renders freeze d3 transitions at frame 0);
  //         no entrance animations; animate only in response to a click, if at all.
  function render() {
    var groups = ["All"].concat(st.rows.map(function (r) { return r.group; }).filter(function (g, i, a) { return g != null && a.indexOf(g) === i; }).sort());
    if (groups.indexOf(st.tab) < 0) st.tab = "All";
    $("tabs").innerHTML = groups.length > 2 ? groups.map(function (g) { return '<button class="tab' + (g === st.tab ? " on" : "") + '" data-tab="' + esc(g) + '">' + esc(g) + "</button>"; }).join("") : "";
    var rows = st.rows.filter(function (r) { return st.tab === "All" || r.group === st.tab; }).sort(function (a, b) { return (b.value || 0) - (a.value || 0); });
    var body = $("body");
    if (!rows.length) { body.innerHTML = '<div class="empty">' + (st.cfg.source ? "No rows" : "Bind a source element to begin") + "</div>"; return; }
    var max = Math.max.apply(null, rows.map(function (r) { return Math.abs(r.value || 0); })) || 1;
    $("sub").textContent = rows.length + " rows";
    body.innerHTML = rows.map(function (r, i) {
      return '<div class="row' + (st.sel === r.label ? " sel" : "") + '" data-i="' + i + '"><div class="lbl" title="' + esc(r.label) + '">' + esc(r.label) + "</div>" +
        '<div class="trk"><div class="fill" data-w="' + (100 * Math.abs(r.value || 0) / max) + '"></div></div><div class="val">' + fmt(r.value) + "</div></div>";
    }).join("");
    body._rows = rows;
    // Final widths go in synchronously. A rAF-deferred entrance animation never fires in
    // headless renders (Sigma's PNG export included), so bars would export empty.
    Array.prototype.forEach.call(body.querySelectorAll(".fill"), function (el) { el.style.width = el.getAttribute("data-w") + "%"; });
  }

  // ---- 3. Interaction: tabs, hover tooltip, click to select.
  $("tabs").addEventListener("click", function (e) { var b = e.target.closest("[data-tab]"); if (!b) return; st.tab = b.getAttribute("data-tab"); render(); });
  var tip = $("tip");
  $("body").addEventListener("mousemove", function (e) {
    var el = e.target.closest(".row"); if (!el) { tip.style.opacity = 0; return; }
    var r = $("body")._rows[+el.getAttribute("data-i")];
    tip.innerHTML = "<b>" + esc(r.label) + "</b><br>" + esc(r.group || "") + " · " + fmt(r.value) + (r.detail ? "<br>" + esc(r.detail) : "");
    var box = $("pl").getBoundingClientRect(), x = e.clientX - box.left + 14, y = e.clientY - box.top + 14;
    if (x + 250 > box.width) x -= 268;
    if (y + 90 > box.height) y -= 104;
    tip.style.left = x + "px"; tip.style.top = y + "px"; tip.style.opacity = 1;
  });
  $("body").addEventListener("mouseleave", function () { tip.style.opacity = 0; });
  $("body").addEventListener("click", function (e) {
    var el = e.target.closest(".row"); if (!el) return;
    var r = $("body")._rows[+el.getAttribute("data-i")];
    st.sel = st.sel === r.label ? null : r.label; render();
  });

  // ---- 4. Data. Resolve each key by bound column id, then by id suffix, then by column NAME
  //         (bare-id bindings have left plugins on "waiting for data").
  function colId(v) { return v && typeof v === "object" ? (v.columnId || v.id) : v; }
  function resolve(dd) {
    var map = {};
    KEYS.forEach(function (k) {
      var id = colId(st.cfg[k]);
      if (id && dd[id]) { map[k] = id; return; }
      if (id) { var hit = Object.keys(dd).filter(function (dk) { return dk.split("/").pop() === id; })[0]; if (hit) { map[k] = hit; return; } }
      var want = LABELS[k].toLowerCase();
      var byName = Object.keys(st.cols).filter(function (c) { return String((st.cols[c] && st.cols[c].name) || "").toLowerCase() === want && dd[c]; })[0];
      if (byName) map[k] = byName;
    });
    return map;
  }
  function num(v) { return v == null || v === "" ? null : +v; }
  function load(dd) {
    var map = resolve(dd), n = 0, out = [];
    KEYS.forEach(function (k) { if (map[k]) n = Math.max(n, dd[map[k]].length); });
    for (var i = 0; i < n; i++) {
      var r = {}; KEYS.forEach(function (k) { var v = map[k] ? dd[map[k]][i] : null; r[k] = NUM[k] ? num(v) : v; });
      out.push(r);
    }
    st.rows = out; render();
  }

  // ---- 5. Test hook: the headless export never feeds plugin data, so tests inject rows here.
  window.__load = function (rows) {
    st.cfg = { source: "test" };
    st.rows = rows.map(function (r) { var o = {}; KEYS.forEach(function (k) { o[k] = NUM[k] ? num(r[k]) : r[k]; }); return o; });
    render();
  };

  // ---- 6. Wire up. Read config.get() immediately, then subscribe for changes.
  function wire(cfg) {
    st.cfg = cfg || {};
    [st.u1, st.u2].forEach(function (u) { if (u) { try { u(); } catch (e) {} } });
    if (!st.cfg.source) { render(); return; }
    try { st.u2 = client.elements.subscribeToElementColumns(st.cfg.source, function (c) { st.cols = c || {}; if (st.dd) load(st.dd); }); } catch (e) {}
    st.u1 = client.elements.subscribeToElementData(st.cfg.source, function (dd) { if (dd && Object.keys(dd).length) { st.dd = dd; load(dd); } });
  }
  if (client) {
    try { var now = client.config.get(); if (now && now.source) wire(now); } catch (e) {}
    client.config.subscribe(wire);
  }
  var rt; window.addEventListener("resize", function () { clearTimeout(rt); rt = setTimeout(function () { render(); }, 80); });
})();
</script>
</body>
</html>
